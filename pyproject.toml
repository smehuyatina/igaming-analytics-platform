[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "igaming-analytics-platform"
version = "1.0.0"
description = "Independent synthetic iGaming analytics portfolio simulation"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3", "numpy>=2,<3", "matplotlib>=3.9,<4", "seaborn>=0.13,<0.14",
  "plotly>=6,<7", "streamlit>=1.45,<2", "SQLAlchemy>=2,<3", "psycopg[binary]>=3.2,<4"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[project.scripts]
igaming = "igaming.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and loaded data"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
