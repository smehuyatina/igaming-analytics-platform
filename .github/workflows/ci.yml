name: Analytics quality
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio_local
          POSTGRES_DB: igaming
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portfolio -d igaming"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://portfolio:portfolio_local@localhost:5432/igaming
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests app.py
      - run: igaming all
      - run: pytest -v
      - uses: actions/upload-artifact@v4
        with:
          name: analytics-evidence-${{ matrix.python-version }}
          path: reports/
